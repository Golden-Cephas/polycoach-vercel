<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — PolyCoach</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<!-- KEEP YOUR EXISTING HTML UI EXACTLY AS IS -->
<!-- ONLY LOGIC BELOW HAS BEEN FIXED & MERGED -->

<script>

/* ================= RECEIPT (FULL ORIGINAL STYLE RESTORED) ================= */
async function downloadReceipt(b){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFontSize(18);
  doc.text("PolyCoach Receipt", 14, 20);

  doc.setFontSize(12);
  doc.text(`Name: ${b.passengerName}`, 14, 40);
  doc.text(`Phone: ${b.phone}`, 14, 50);
  doc.text(`From: ${b.origin || b.from}`, 14, 60);
  doc.text(`To: ${b.destination || b.to}`, 14, 70);
  doc.text(`Seat: ${b.seatNumber}`, 14, 80);
  doc.text(`Program: ${b.program || '-'}`, 14, 90);
  doc.text(`Status: ${b.status}`, 14, 100);

  doc.save(`Receipt_${b.passengerName}.pdf`);
}

/* ================= FIX BUTTON USAGE ================= */
function renderReceiptButton(booking){
  return `<button onclick='downloadReceipt(${JSON.stringify(booking)})'>Download Receipt</button>`;
}

/* ================= SEAT LIST PDF (WITH ORIGIN + DESTINATION) ================= */
async function downloadBusListPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const res = await fetch('/api/bookings');
  const data = await res.json();

  doc.text("Seat Booking List", 14, 15);

  doc.autoTable({
    startY: 20,
    head: [[
      "Name",
      "Phone",
      "Origin",
      "Destination",
      "Seat",
      "Status"
    ]],
    body: data.map(i => [
      i.passengerName,
      i.phone,
      i.origin || i.from || '-',
      i.destination || i.to || '-',
      i.seatNumber || '-',
      i.status || '-'
    ])
  });

  doc.save("Seat_List.pdf");
}

/* ================= NAME MATCH CHECK (STRICT) ================= */
async function addBooking(){
  const name = document.getElementById("mb-name").value.trim();
  const phone = document.getElementById("mb-phone").value.trim();
  const seat = document.getElementById("mb-seat").value;
  const dest = document.getElementById("mb-dest").value;

  if(!name) return alert("Name required");

  const res = await fetch('/api/bookings');
  const list = await res.json();

  const exists = list.some(x =>
    x.passengerName && x.passengerName.toLowerCase() === name.toLowerCase()
  );

  if(exists){
    alert("⚠ Name already exists in booking or pending list");
  }

  await fetch('/api/bookings',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      passengerName:name,
      phone:phone,
      seatNumber:seat,
      destination:dest
    })
  });

  location.reload();
}

</script>

</body>
</html>
