<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — PolyCoach</title>
<link rel="stylesheet" href="/css/Home-Page.css">
<style>
.reg-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.reg-grid .full{grid-column:span 2;}
.reg-hint{font-size:0.78rem;color:var(--muted);margin-top:4px;}
#msg{margin-top:14px;padding:12px;border-radius:6px;font-weight:700;display:none;}
#msg.success{background:#e6f4ea;color:#2e7d32;}
#msg.error{background:#fdecea;color:var(--danger);}
.bus-chooser{display:flex;gap:10px;margin-top:6px;}
.bus-choice{flex:1;padding:12px;border:2px solid #ddd;border-radius:8px;cursor:pointer;text-align:center;font-weight:700;font-size:0.9rem;color:#555;transition:all 0.2s;background:#fff;}
.bus-choice.selected{border-color:var(--primary);background:var(--primary);color:#fff;}
.common-field input{background:#f0f4ff;color:#555;cursor:default;}
/* Seat map embedded in register */
.seat-section{margin-top:22px;display:none;}
.seat-section h3{font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;color:var(--primary);margin-bottom:10px;}
#regSeatTooltip{position:fixed;background:#333;color:#fff;padding:6px 12px;border-radius:5px;font-size:0.8rem;pointer-events:none;display:none;z-index:500;white-space:nowrap;}
/* Page-specific background — uses Register.png if available, falls back to Background1.png */
.Page-Body-Hero{background-image:linear-gradient(rgba(11,41,77,0.82),rgba(11,41,77,0.68)),url('/Images/Register.png'),url('/Images/Background1.png');background-size:cover;background-position:center;}
@media(max-width:520px){.reg-grid{grid-template-columns:1fr;}.reg-grid .full{grid-column:span 1;}}
</style>
</head>
<body>

<div class="Home-Page-Header">
  <div class="Left-Header" onclick="location.href='Home-Page.html'">
    <img src="/Images/Logo1.png" class="Logo1" alt="Logo">
    <div class="Logo-Text">PolyCoach</div>
  </div>
  <div class="Right-Header">
    <button class="Header-Button" onclick="location.href='Home-Page.html'">Home</button>
    <button class="Header-Button" onclick="location.href='Book-Login.html'">Book</button>
    <button class="Header-Button" onclick="location.href='Help.html'">Help</button>
  </div>
</div>

<div class="Page-Body-Hero">
  <div class="page-card-container" style="max-width:520px;">
    <div class="page-hero-title">
      <h1>Student Registration</h1>
      <p>Fill in your details to register with PolyCoach.</p>
    </div>
    <div class="form-card">
      <form id="regForm">
        <div class="reg-grid">

          <!-- Full Name -->
          <div class="input-group full">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
          </div>

          <!-- Phone -->
          <div class="input-group full">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="e.g. 0991234567" required>
          </div>

          <!-- Bus chooser -->
          <div class="input-group full" id="busGroup">
            <label>Choose Your Bus <span style="color:var(--danger);">*</span></label>
            <div class="bus-chooser" id="busChooser" style="visibility:hidden;">
              <div class="bus-choice" id="busChoice1" onclick="chooseBus('bus1')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="vertical-align:-2px"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>&nbsp; <span id="busLabel1"></span>
              </div>
              <div class="bus-choice" id="busChoice2" onclick="chooseBus('bus2')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="vertical-align:-2px"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>&nbsp; <span id="busLabel2"></span>
              </div>
            </div>
            <input type="hidden" id="busId" value="">
          </div>

          <!-- Auto-assigned bus note (holiday mode) -->
          <div class="full" id="busAssigned" style="display:none;font-weight:700;color:var(--primary);"></div>

          <!-- Common field (read-only, from settings) -->
          <div class="input-group full common-field">
            <label id="commonLabel"></label>
            <input type="text" id="commonField" readonly>
          </div>

          <!-- Origin (manual) — shown in back-to-school mode -->
          <div class="input-group full" id="originGroup" style="display:none;">
            <label id="originLabel">Origin</label>
            <select id="origin">
              <option value="" disabled selected>-- Choose Origin --</option>
              <option>Mzuzu</option><option>Mzimba</option><option>Jenda</option>
              <option>Karonga</option><option>Rumphi</option><option>Nkhata Bay</option>
              <option>Chitipa</option><option>Kasungu</option>
            </select>
          </div>

          <!-- Destination (manual) — shown in holiday mode -->
          <div class="input-group full" id="destGroup">
            <label id="destLabel">Destination</label>
            <select id="destination">
              <option value="" disabled selected>-- Choose Destination --</option>
              <option>Mzuzu</option><option>Mzimba</option><option>Jenda</option>
              <option>Karonga</option><option>Rumphi</option><option>Nkhata Bay</option>
              <option>Chitipa</option><option>Kasungu</option>
            </select>
          </div>

        </div>
        <!-- Seat map (shown after registration) -->
        <div class="seat-section" id="seatSection">
          <h3>Choose Your Seat</h3>
          <p style="font-size:0.85rem;color:var(--muted);margin-bottom:10px;">You are registered. Click an available seat, then tap Submit.</p>
          <div class="bus-exterior">
            <div class="driver-cabin">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:#555"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M12 3v7M3.5 14l6.8-2M20.5 14l-6.8-2"/></svg>
              <span style="font-weight:700;color:#555;">Driver</span>
            </div>
            <div id="regSeatMap" class="bus-grid"></div>
          </div>
          <div class="seat-legend">
            <div class="legend-item"><div class="legend-box legend-available"></div> Available</div>
            <div class="legend-item"><div class="legend-box legend-pending"></div> Taken</div>
            <div class="legend-item"><div class="legend-box legend-selected"></div> Selected</div>
          </div>
          <input type="hidden" id="selectedSeatNum" value="">
          <button type="button" class="submit-btn" id="completeBtn" style="margin-top:18px;">SUBMIT</button>
          <p style="text-align:center;margin-top:12px;font-size:0.85rem;color:var(--muted);">Not you? <a href="#" id="startOverLink">Start over</a></p>
        </div>

        <button type="submit" class="submit-btn" id="chooseSeatBtn" style="margin-top:18px;">CHOOSE SEAT</button>
        <div id="msg"></div>
        <div class="login-footer">
          <p>Already registered? <a href="Book-Login.html">Click here to book</a></p>
        </div>
      </form>
    </div>
  </div>
</div>
<div id="regSeatTooltip"></div>

<div class="Home-Page-Footer">
  <div class="Home-Left-Footer"><img src="/Images/Logo3.png" loading="lazy" decoding="async" class="Logo1" alt="Logo"><div class="Logo-Text1">PolyCoach</div></div>
  <div class="Home-Mid-Footer">
    <button class="Footer-Button" onclick="openPopup('about')">About Us</button>
    <button class="Footer-Button" onclick="openPopup('faq')">FAQs</button>
    <button class="Footer-Button" onclick="openPopup('contact')">Contact</button>
  </div>
  <div class="Home-Right-Footer">
    <div class="Footer-Text">Social Media:</div>
    <div class="Social-Container">
      <a href="https://chat.whatsapp.com/IoxQg9cuzsI1FNG7Awt8Vj" target="_blank"><div class="Footer-Icons"><img src="/Images/Facebook.png" loading="lazy" decoding="async"></div></a>
      <a href="https://chat.whatsapp.com/IoxQg9cuzsI1FNG7Awt8Vj" target="_blank"><div class="Footer-Icons"><img src="/Images/Twitter.png" loading="lazy" decoding="async"></div></a>
      <a href="https://chat.whatsapp.com/IoxQg9cuzsI1FNG7Awt8Vj" target="_blank"><div class="Footer-Icons"><img src="/Images/Whatsapp.png" loading="lazy" decoding="async"></div></a>
    </div>
  </div>
</div>

<div id="popupOverlay" class="popup-overlay">
  <div class="popup-box"><div id="popupContent"></div>
  <button class="close-btn" onclick="closePopup()">Close</button></div>
</div>

<script src="/js/popup.js" defer></script>
<script>
let _settings = {};
let _selectedBus = "";
let _selectedSeat = null;
const _regTooltip = document.getElementById("regSeatTooltip");

/* ── Seat data: one request per bus, shared by the full-bus check and the picker ── */
const _seatCache = {};
function getSeats(busId, fresh){
  const hit = _seatCache[busId];
  if(!fresh && hit && Date.now()-hit.t < 20000) return hit.p;
  const p = fetch("/api/seats?busId="+busId).then(r=>r.json());
  _seatCache[busId] = {t:Date.now(), p};
  p.catch(()=>{ delete _seatCache[busId]; });
  return p;
}
getSeats("bus1"); // start now, in parallel with /api/settings

/* ── Load settings and apply trip mode ── */
fetch("/api/settings").then(r=>r.json()).then(async s=>{
  _settings = s;
  const mode = s.tripMode||"holiday";
  applyTripMode(mode);
  document.getElementById("busLabel1").textContent = s.bus1Name||"Bus 1";
  document.getElementById("busLabel2").textContent = s.bus2Name||"Bus 2";
  const resumed = restorePendingReg(mode); // reload after CHOOSE SEAT: keep their details, go straight back to the seat map
  if(mode==="backtoschool"){
    document.getElementById("busChooser").style.visibility = "visible";
  } else if(!resumed){
    await autoAssignBus();   // holiday mode: fill bus1 first, then bus2
  }
}).catch(()=>{});

/* ── Holiday mode: auto-assign the bus currently being filled ── */
const BUS_CAPACITY = 72; // 13 rows x 5 seats + 7 back-row seats
let _allFull = false;

async function isBusFull(busId){
  const seats = await getSeats(busId);
  const taken = new Set(
    seats.filter(x=>x.number>=1 && x.number<=BUS_CAPACITY && x.status!=="available").map(x=>x.number)
  );
  return taken.size >= BUS_CAPACITY;
}

async function autoAssignBus(){
  const note = document.getElementById("busAssigned");
  try{
    for(const id of ["bus1","bus2"]){
      if(!(await isBusFull(id))){
        chooseBus(id);
        const name = _settings[id+"Name"] || (id==="bus1" ? "Bus 1" : "Bus 2");
        note.textContent = "You will be travelling on: " + name;
        note.style.display = "block";
        return;
      }
    }
    _allFull = true;
    note.textContent = "Sorry, all buses are currently full.";
    note.style.color = "var(--danger)";
    note.style.display = "block";
  }catch{
    // If the seat check fails, fall back to manual choice
    document.getElementById("busGroup").style.display = "block";
    document.getElementById("busChooser").style.visibility = "visible";
  }
}

document.addEventListener("mousemove",e=>{
  if(_regTooltip.style.display!=="none"){
    const tw=_regTooltip.offsetWidth, th=_regTooltip.offsetHeight;
    const vw=window.innerWidth,       vh=window.innerHeight;
    let left=e.clientX+14;
    if(left+tw+10>vw) left=e.clientX-tw-10;
    let top=e.clientY-30;
    if(top<0) top=e.clientY+14;
    if(top+th>vh) top=vh-th-8;
    _regTooltip.style.left=Math.max(4,left)+"px";
    _regTooltip.style.top=Math.max(4,top)+"px";
  }
});

function applyTripMode(mode){
  const isHoliday = mode !== "backtoschool";
  document.getElementById("busGroup").style.display = isHoliday ? "none" : "block";
  document.getElementById("commonLabel").textContent = isHoliday ? "Departure Venue" : "Destination";
  document.getElementById("originGroup").style.display = isHoliday ? "none"  : "block";
  document.getElementById("destGroup").style.display   = isHoliday ? "block" : "none";
}

function chooseBus(busId){
  if(_registered) return; // bus is locked once the student is registered
  _selectedBus = busId;
  _selectedSeat = null;
  document.getElementById("busId").value = busId;
  document.getElementById("selectedSeatNum").value = "";
  document.getElementById("busChoice1").classList.toggle("selected", busId==="bus1");
  document.getElementById("busChoice2").classList.toggle("selected", busId==="bus2");
  const venue = _settings[busId+"Venue"] || _settings.departureVenue || "";
  document.getElementById("commonField").value = venue;
}

/* ── Seat map (bus view): loads after registration ── */
let _seatReq = 0;

async function loadRegSeats(busId){
  const map = document.getElementById("regSeatMap");
  const myReq = ++_seatReq;
  map.innerHTML = "<div style='padding:12px;color:#888;'>Loading seats…</div>";
  try{
    const seats = await getSeats(busId, true);
    if(myReq !== _seatReq) return; // a newer load replaced this one
    map.innerHTML = "";
    let counter = 1;
    for(let row=0;row<13;row++){
      for(let col=1;col<=6;col++){
        if(col===3){const a=document.createElement("div");a.className="seat aisle-space";map.appendChild(a);}
        else if(counter<=65){renderRegSeat(seats,counter,map);counter++;}
      }
    }
    const backRow=document.createElement("div");backRow.className="back-row-container";
    for(let i=0;i<7;i++){renderRegSeat(seats,counter,backRow);counter++;}
    map.appendChild(backRow);
  }catch{
    if(myReq !== _seatReq) return;
    map.innerHTML="<div style='padding:12px;color:red;'>Failed to load seats.</div>";
  }
}

function renderRegSeat(seats,num,parent){
  const data=seats.find(s=>s.number===num)||{number:num,status:"available"};
  const displayStatus=data.status==="booked"?"pending":data.status; // merge booked+pending -> Taken (pending color)
  const div=document.createElement("div");
  div.className="seat "+displayStatus;
  div.textContent=num;
  div.addEventListener("mouseenter",e=>{
    let tip="Seat "+num;
    if(data.passengerName) tip+=" — "+data.passengerName;
    else tip+=" ("+(displayStatus==="available" ? "Available" : "Taken")+")";
    _regTooltip.textContent=tip;
    _regTooltip.style.visibility="hidden";
    _regTooltip.style.display="block";
    const tw=_regTooltip.offsetWidth, vw=window.innerWidth;
    const left=e.clientX+14+tw+10>vw ? e.clientX-tw-10 : e.clientX+14;
    _regTooltip.style.left=Math.max(4,left)+"px";
    _regTooltip.style.top=Math.max(4,e.clientY-30)+"px";
    _regTooltip.style.visibility="visible";
  });
  div.addEventListener("mouseleave",()=>_regTooltip.style.display="none");
  if(displayStatus==="available"){
    div.onclick=()=>selectRegSeat(num,div);
  } else {
    div.onclick=()=>showRegSeatMsg("Seat "+num+" is already taken.");
  }
  parent.appendChild(div);
}

function selectRegSeat(num,el){
  document.querySelectorAll("#regSeatMap .seat.selected, #regSeatMap ~ * .seat.selected").forEach(s=>{
    s.className="seat "+(s._origStatus||"available");
  });
  // Also clear back row
  document.querySelectorAll(".back-row-container .seat.selected").forEach(s=>{
    s.className="seat "+(s._origStatus||"available");
  });
  el._origStatus="available";
  el.className="seat selected";
  _selectedSeat=num;
  document.getElementById("selectedSeatNum").value=num;
}

function showRegSeatMsg(text){
  let el=document.getElementById("regSeatMsg");
  if(!el){el=document.createElement("div");el.id="regSeatMsg";el.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 22px;border-radius:8px;font-weight:700;font-size:0.9rem;z-index:999;";document.body.appendChild(el);}
  el.textContent=text;el.style.display="block";
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.display="none",2200);
}

/* ── Keep the registration across reloads until SUBMIT is done ── */
const PENDING_KEY = "polycoachPendingReg";
const PENDING_TTL = 24*60*60*1000; // 24 hours

function savePendingReg(mode){
  try{ localStorage.setItem(PENDING_KEY, JSON.stringify({..._reg, mode, t:Date.now()})); }catch{}
}
function clearPendingReg(){
  try{ localStorage.removeItem(PENDING_KEY); }catch{}
}

// Lock the details and show the seat map for the registered student
function openSeatStep(scroll){
  document.querySelectorAll("#regForm input:not([type=hidden]), #regForm select").forEach(el=>{ el.disabled = true; });
  document.getElementById("chooseSeatBtn").style.display = "none";
  const sec = document.getElementById("seatSection");
  sec.style.display = "block";
  loadRegSeats(_reg.busId);
  if(scroll) sec.scrollIntoView({behavior:"smooth", block:"start"});
}

// On page load: if this device has a registration waiting for its seat, bring it back
function restorePendingReg(mode){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(PENDING_KEY) || "null"); }catch{}
  if(!saved) return false;
  if(saved.mode !== mode || !saved.busId || !saved.name || Date.now()-saved.t > PENDING_TTL){
    clearPendingReg(); return false;
  }
  chooseBus(saved.busId); // sets the bus, venue and highlight (runs before the lock below)
  document.getElementById("name").value  = saved.name;
  document.getElementById("phone").value = saved.phone;
  if(mode==="backtoschool") document.getElementById("origin").value = saved.origin || "";
  else{
    document.getElementById("destination").value = saved.dest || "";
    const note = document.getElementById("busAssigned");
    note.textContent = "You will be travelling on: " + (_settings[saved.busId+"Name"] || (saved.busId==="bus1" ? "Bus 1" : "Bus 2"));
    note.style.display = "block";
  }
  _registered = true;
  _reg = {name:saved.name, phone:saved.phone, busId:saved.busId, origin:saved.origin||"", dest:saved.dest||""};
  openSeatStep(false);
  return true;
}

document.getElementById("startOverLink").addEventListener("click", function(e){
  e.preventDefault();
  clearPendingReg();
  location.reload();
});

/* ── Step 1: CHOOSE SEAT — register the student, then load the seat map ── */
let _registered = false;
let _reg = null;

document.getElementById("regForm").addEventListener("submit", async function(e){
  e.preventDefault();
  if(_registered) return;
  const msg   = document.getElementById("msg");
  const btn   = document.getElementById("chooseSeatBtn");
  const name  = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const busId = document.getElementById("busId").value;
  const isHoliday = (_settings.tripMode||"holiday") !== "backtoschool";
  const origin= isHoliday ? "" : (document.getElementById("origin").value||"");
  const dest  = isHoliday ? (document.getElementById("destination").value||"") : "";

  if(!name||!phone){
    msg.className="error"; msg.style.display="block";
    msg.textContent="Please enter your name and phone number."; return;
  }
  if(!busId){
    msg.className="error"; msg.style.display="block";
    msg.textContent=_allFull ? "Sorry, all buses are currently full." : "Please choose your bus."; return;
  }
  if(isHoliday && !dest){
    msg.className="error"; msg.style.display="block";
    msg.textContent="Please select your destination."; return;
  }
  if(!isHoliday && !origin){
    msg.className="error"; msg.style.display="block";
    msg.textContent="Please select your origin."; return;
  }

  btn.disabled=true; btn.textContent="Registering...";
  msg.style.display="none";

  try{
    const regRes = await fetch("/api/register",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name, phone, busId, origin, destination:dest})
    });
    const regData = await regRes.json();
    if(!regData.success){
      msg.className="error"; msg.style.display="block";
      msg.textContent=regData.message||"Registration failed. Please try again.";
      btn.disabled=false; btn.textContent="CHOOSE SEAT"; return;
    }

    // Registered: remember it (survives a reload), lock the details, open the seat map
    _registered = true;
    _reg = {name, phone, busId, origin, dest};
    localStorage.setItem("polycoachBus", busId);
    savePendingReg(_settings.tripMode||"holiday");
    openSeatStep(true);

  }catch{
    msg.className="error"; msg.style.display="block";
    msg.textContent="Server error. Please try again.";
    btn.disabled=false; btn.textContent="CHOOSE SEAT";
  }
});

/* ── Step 2: SUBMIT — book the chosen seat, then show the success page ── */
document.getElementById("completeBtn").addEventListener("click", async function(){
  const msg = document.getElementById("msg");
  const btn = this;
  if(!_registered || !_reg) return;
  if(!_selectedSeat){
    msg.className="error"; msg.style.display="block";
    msg.textContent="Please select a seat to complete your booking."; return;
  }

  btn.disabled=true; btn.textContent="Submitting...";
  msg.style.display="none";

  try{
    const bookRes = await fetch("/api/book-seat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        seatNumber: Number(_selectedSeat),
        busId: _reg.busId,
        passengerName: _reg.name,
        destination: _reg.dest,
        origin: _reg.origin,
        phone: _reg.phone,
        program: "",
        paymentProof: null,
        releaseOldSeat: null
      })
    });
    const bookData = await bookRes.json();
    if(!bookData.success){
      // e.g. someone took the seat first: stay here, refresh the map, let them pick again
      msg.className="error"; msg.style.display="block";
      msg.textContent=bookData.message||"That seat could not be booked. Please choose another seat.";
      _selectedSeat=null;
      document.getElementById("selectedSeatNum").value="";
      loadRegSeats(_reg.busId);
      btn.disabled=false; btn.textContent="SUBMIT"; return;
    }

    localStorage.setItem("polycoachBus", _reg.busId);
    clearPendingReg(); // registration is complete
    window.location.href="Thanks-Remark1.html";

  }catch{
    msg.className="error"; msg.style.display="block";
    msg.textContent="Server error. Please try again.";
    btn.disabled=false; btn.textContent="SUBMIT";
  }
});
</script>
</body>
</html>
