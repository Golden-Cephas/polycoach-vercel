<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Bus Status — PolyCoach</title>
<link rel="stylesheet" href="/css/Home-Page.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
#errMsg{display:none;background:#fff8e1;color:#7b5c00;border-radius:6px;padding:12px;margin-top:12px;font-weight:600;font-size:0.9rem;}
/* ───── RAFFLE DRAW STAGE ───── */
.rf-stage{--u:1vh;--rowH:76px;position:relative;display:none;color:#fff;overflow:hidden;padding:20px 18px 30px;background:radial-gradient(ellipse at 50% 0%,#1b4f8f 0%,#0b294d 42%,#050f1f 100%);font-family:'Lato',Arial,sans-serif;}
@supports(height:1dvh){.rf-stage{--u:1dvh;}}
.rf-stage.rf-open{display:block;}
.rf-confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}
.rf-toolbar{position:relative;z-index:6;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.rf-title{font-family:'Barlow Condensed',Arial,sans-serif;font-size:1.7rem;font-weight:700;letter-spacing:.5px;}
.rf-title i{color:#ffc83d;margin-right:8px;}
.rf-pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:6px 14px;font-size:.82rem;font-weight:700;}
.rf-tools{margin-left:auto;display:flex;gap:8px;}
.rf-tbtn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:9px 14px;font-weight:700;font-size:.85rem;cursor:pointer;font-family:inherit;}
.rf-tbtn i{margin-right:6px;}
.rf-tbtn:hover{background:rgba(255,255,255,.2);}

.rf-body{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start;}
.rf-main{display:flex;flex-direction:column;align-items:center;gap:18px;min-width:0;}

/* prize card */
.rf-gift-card{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:18px 18px 16px;box-shadow:0 18px 40px rgba(0,0,0,.35);}
.rf-counter{background:#ffc83d;color:#0b294d;font-weight:800;font-size:.78rem;letter-spacing:1.2px;padding:5px 14px;border-radius:20px;}
.rf-photo{position:relative;width:100%;max-width:480px;height:clamp(170px,30vw,250px);border-radius:16px;background:rgba(0,0,0,.28);box-shadow:0 0 0 2px rgba(255,200,61,.55),0 0 34px rgba(255,200,61,.25);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:4.5rem;color:#ffc83d;}
.rf-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
.rf-gift-name{font-family:'Barlow Condensed',Arial,sans-serif;font-weight:700;font-size:clamp(26px,calc(var(--u)*4.4),46px);line-height:1.05;color:#ffc83d;word-break:break-word;}
.rf-gift-desc{font-size:clamp(12px,calc(var(--u)*2),17px);color:rgba(255,255,255,.78);min-height:1.2em;}

/* reel */
.rf-reel-wrap{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.rf-reel{position:relative;width:100%;height:calc(var(--rowH)*3);overflow:hidden;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);}
.rf-reel::before,.rf-reel::after{content:"";position:absolute;left:0;right:0;height:var(--rowH);z-index:2;pointer-events:none;}
.rf-reel::before{top:0;background:linear-gradient(rgba(5,15,31,.88),rgba(5,15,31,.2));}
.rf-reel::after{bottom:0;background:linear-gradient(rgba(5,15,31,.2),rgba(5,15,31,.88));}
.rf-reel-line{position:absolute;left:0;right:0;top:var(--rowH);height:var(--rowH);border-top:2px solid #ffc83d;border-bottom:2px solid #ffc83d;background:rgba(255,200,61,.1);z-index:1;pointer-events:none;}
.rf-reel-line::before,.rf-reel-line::after{content:"";position:absolute;top:50%;margin-top:-9px;border:9px solid transparent;}
.rf-reel-line::before{left:0;border-left-color:#ffc83d;}
.rf-reel-line::after{right:0;border-right-color:#ffc83d;}
.rf-strip{position:relative;z-index:0;will-change:transform;}
.rf-item{height:var(--rowH);display:flex;align-items:center;justify-content:center;padding:0 22px;font-family:'Barlow Condensed',Arial,sans-serif;font-weight:700;font-size:calc(var(--rowH)*.46);white-space:nowrap;color:#fff;}
.rf-item.win{color:#ffc83d;text-shadow:0 0 18px rgba(255,200,61,.7);}
.rf-item.win span{display:inline-block;animation:rfPop .6s ease;}
.rf-winner-sub{min-height:2.6em;text-align:center;font-size:clamp(12px,calc(var(--u)*2),16px);color:rgba(255,255,255,.85);opacity:0;transition:opacity .5s;line-height:1.35;}
.rf-winner-sub.show{opacity:1;}
.rf-winner-sub b{display:block;color:#ffc83d;font-size:1.15em;letter-spacing:.4px;}

/* spin button */
.rf-spin{width:100%;max-width:560px;border:none;border-radius:16px;padding:16px 0;font-family:'Barlow Condensed',Arial,sans-serif;font-weight:800;font-size:clamp(22px,calc(var(--u)*3.8),34px);letter-spacing:2px;color:#0b294d;cursor:pointer;background:linear-gradient(180deg,#ffd75e,#f2a900);box-shadow:0 8px 0 #b97e00,0 14px 26px rgba(0,0,0,.35);transition:transform .1s,box-shadow .1s;}
.rf-spin.ready{animation:rfPulse 1.8s infinite;}
.rf-spin:active:not(:disabled){transform:translateY(5px);box-shadow:0 3px 0 #b97e00,0 8px 18px rgba(0,0,0,.35);}
.rf-spin:disabled{opacity:.7;cursor:default;animation:none;}
.rf-msg{min-height:1.2em;text-align:center;color:#ffb3b3;font-weight:700;font-size:.9rem;}

/* winners board */
.rf-board{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:16px;max-height:640px;overflow:auto;}
.rf-board h3{font-family:'Barlow Condensed',Arial,sans-serif;font-size:1.4rem;color:#ffc83d;margin-bottom:12px;}
.rf-b-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;border:1px solid transparent;opacity:.62;}
.rf-b-row+.rf-b-row{margin-top:6px;}
.rf-b-row.done{opacity:1;background:rgba(255,255,255,.06);}
.rf-b-row.cur{opacity:1;border-color:#ffc83d;}
.rf-b-th{width:42px;height:42px;border-radius:8px;background:rgba(0,0,0,.3);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#ffc83d;overflow:hidden;}
.rf-b-th img{width:100%;height:100%;object-fit:cover;}
.rf-b-gift{font-weight:700;font-size:.88rem;}
.rf-b-win{font-size:.8rem;color:rgba(255,255,255,.8);margin-top:2px;}
.rf-b-win i{color:#ffc83d;margin-right:4px;}

/* finished screen (public view: no admin wording here) */
.rf-done{display:none;position:relative;z-index:2;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:10px 0 6px;}
.rf-done-icon{font-size:4rem;color:#ffc83d;}
.rf-done h2{font-family:'Barlow Condensed',Arial,sans-serif;font-size:clamp(28px,calc(var(--u)*5),48px);color:#ffc83d;}
.rf-done p{color:rgba(255,255,255,.85);}
.rf-done-list{width:100%;max-width:820px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;max-height:calc(var(--u)*52);overflow:auto;}
.rf-stage.rf-complete .rf-body{display:none;}
.rf-stage.rf-complete .rf-done{display:flex;}

/* exit control — only visible in full screen, kept small and faint */
.rf-exit-fs{display:none;position:absolute;top:8px;right:8px;z-index:8;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:.9rem;opacity:.3;cursor:pointer;}
.rf-exit-fs:hover{opacity:.9;}

/* ── FULL SCREEN: top bar gone, prize card + reel + spin fit one screen ── */
html.rf-lock,html.rf-lock body{overflow:hidden;background:#0b294d;}
.rf-stage:fullscreen,.rf-stage:-webkit-full-screen{background:radial-gradient(ellipse at 50% 0%,#1b4f8f 0%,#0b294d 42%,#050f1f 100%);}
.rf-stage::backdrop{background:#0b294d;}
.rf-loading{display:none;padding:90px 20px;text-align:center;font-weight:700;font-size:1.05rem;color:#0b294d;}
.rf-loading.show{display:block;}
.rf-stage.rf-open.rf-fs{position:fixed;inset:0;z-index:99999;width:100%;height:calc(var(--u)*100);display:flex;flex-direction:column;overflow:hidden;--rowH:clamp(40px,calc(var(--u)*9),104px);padding:max(env(safe-area-inset-top),calc(var(--u)*1.6)) max(env(safe-area-inset-right),14px) max(env(safe-area-inset-bottom),calc(var(--u)*1.6)) max(env(safe-area-inset-left),14px);}
.rf-fs .rf-toolbar{display:none;}
.rf-fs .rf-exit-fs{display:block;top:max(env(safe-area-inset-top),8px);}
.rf-fs .rf-body{flex:1;min-height:0;align-items:stretch;}
.rf-fs .rf-main{height:100%;min-height:0;gap:calc(var(--u)*1.6);justify-content:center;}
.rf-fs .rf-gift-card{flex:1 1 auto;min-height:0;padding:calc(var(--u)*1.6) 16px;gap:calc(var(--u)*1);}
.rf-fs .rf-photo{flex:1 1 0;height:auto;min-height:56px;max-width:100%;}
.rf-fs .rf-board{max-height:100%;}
.rf-fs .rf-spin{padding:calc(var(--u)*1.7) 0;flex-shrink:0;}
.rf-fs .rf-msg{min-height:0;}
.rf-fs .rf-done{flex:1;justify-content:center;}

/* animations */
@keyframes rfPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.025);}}
@keyframes rfPop{0%{transform:scale(.6);opacity:0;}60%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}

/* phones & small screens */
@media(max-width:800px){
  .rf-body{grid-template-columns:minmax(0,1fr);}
  .rf-board{max-height:340px;}
  .rf-fs .rf-board{display:none;}
  .rf-tools{margin-left:0;width:100%;}
  .rf-done-list{grid-template-columns:1fr;}
}
/* phone held sideways: prize card left, reel + spin right */
@media(orientation:landscape) and (max-height:560px){
  .rf-stage.rf-fs{--rowH:clamp(34px,calc(var(--u)*13),72px);}
  .rf-fs .rf-main{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto auto;grid-template-areas:"gift reel" "gift spin" "gift msg";column-gap:3vw;row-gap:calc(var(--u)*2);align-content:stretch;}
  .rf-fs .rf-gift-card{grid-area:gift;max-width:none;}
  .rf-fs .rf-reel-wrap{grid-area:reel;align-self:end;max-width:none;}
  .rf-fs .rf-spin{grid-area:spin;max-width:none;}
  .rf-fs .rf-msg{grid-area:msg;}
  .rf-fs .rf-gift-name{font-size:clamp(18px,calc(var(--u)*7),34px);}
}
</style>
</head>
<body>

<div class="Home-Page-Header">
  <div class="Left-Header" onclick="location.href='Home-Page.html'"><img src="/Images/Logo1.png" class="Logo1" alt="Logo"><div class="Logo-Text">PolyCoach</div></div>
  <div class="Right-Header">
    <button class="Header-Button" onclick="location.href='Home-Page.html'">Home</button>
    <button class="Header-Button" onclick="location.href='Book-Login.html'">Book</button>
    <button class="Header-Button" onclick="location.href='Status-Login.html?mode=raffle'">Raffle Draw</button>

          <label>Phone Number</label>

  <div class="rf-toolbar" id="rfToolbar">

    <div class="rf-pill" id="rfPill"></div>

      <button class="rf-tbtn" onclick="location.href='Admin-Dashboard.html'"><i class="fa-solid fa-gauge"></i>Dashboard</button>

  <div class="rf-body" id="rfBody">

      <div class="rf-gift-card" id="rfGiftCard">

<script src="/js/popup.js"></script>
<script>
const RAFFLE_MODE = new URLSearchParams(location.search).get("mode") === "raffle";
const $ = id => document.getElementById(id);
const RF = { data: null, state: "ready", busy: false };
const rfApi = a => "/api/admin?action=" + a;
function rfAuth(){
  return { "Content-Type":"application/json", "Authorization":"Bearer " + (localStorage.getItem("polycoachToken") || "") };
}
function rfEsc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ── Page text for raffle mode ── */
if (RAFFLE_MODE) {
  document.title = "Raffle Draw — PolyCoach";
  $("heroTitle").textContent = "Raffle Draw";
  $("heroSub").textContent = "Admin login to open the raffle.";
  $("viewBtn").textContent = "OPEN RAFFLE";
  $("backLink").style.display = "block";
}

/* ── Data ── */
async function rfLoad(){
  const r = await fetch(rfApi("raffle-get"), { headers: rfAuth() });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.success) {
    const e = new Error(d.message || "Could not load the raffle.");
    e.status = r.status;
    throw e;
  }
  RF.data = d;
}

async function rfEnter(){
  await rfLoad();
  document.querySelector(".Page-Body-Hero").style.display = "none";
  $("rfStage").classList.add("rf-open");
  rfShowCurrent();
  window.scrollTo(0, 0);
}

function rfBackToLogin(msg){
  rfExitFs();
  $("rfStage").classList.remove("rf-open");
  document.querySelector(".Page-Body-Hero").style.display = "";
  const err = $("errMsg");
  err.style.display = "block";
  err.textContent = msg || "Please log in again.";
}

/* ── Rendering ── */
function rfPill(){
  const d = RF.data;
  $("rfPill").textContent = (d.eligibility === "booked" ? "Booked passengers" : "Registered users") + " · " + d.available + " still in the draw";
}

function rfRow(g, cur){
  const th = g.photo ? '<img src="' + rfEsc(g.photo) + '" alt="">' : '<i class="fa-solid fa-gift"></i>';
  return '<div class="rf-b-row' + (g.winnerId ? " done" : "") + (cur ? " cur" : "") + '">' +
    '<div class="rf-b-th">' + th + '</div>' +
    '<div><div class="rf-b-gift">' + rfEsc(g.name) + '</div>' +
    '<div class="rf-b-win">' + (g.winnerId ? '<i class="fa-solid fa-trophy"></i>' + rfEsc(g.winnerName) : "—") + '</div></div></div>';
}

function rfRenderBoard(currentId){
  $("rfBoard").innerHTML = RF.data.gifts.map(g => rfRow(g, g.id === currentId)).join("");
}

function rfIdleReel(){
  const strip = $("rfStrip");
  strip.style.transition = "none";
  strip.style.transform = "none";
  strip.innerHTML = '<div class="rf-item"></div><div class="rf-item"><span>?</span></div><div class="rf-item"></div>';
}

function rfSetSpinBtn(text, ready, disabled){
  const b = $("rfSpinBtn");
  b.textContent = text;
  b.disabled = !!disabled;
  b.classList.toggle("ready", !!ready);
}

function rfMsg(t){ $("rfMsg").textContent = t || ""; }

function rfDone(title, sub, showList){
  $("rfStage").classList.add("rf-complete");
  $("rfDoneTitle").textContent = title;
  $("rfDoneSub").textContent = sub;
  $("rfDoneList").innerHTML = showList ? RF.data.gifts.map(g => rfRow(g, false)).join("") : "";
  rfPill();
}

function rfShowCurrent(){
  const d = RF.data;
  const g = d.gifts.find(x => !x.winnerId);
  RF.state = "ready"; RF.busy = false;
  rfMsg(""); rfPill();

  if (!d.gifts.length) { rfDone("No gifts yet", "Gifts will appear here once they have been added.", false); return; }
  if (!g) { rfDone("All gifts have been given out!", "Congratulations to every winner.", true); return; }

  $("rfStage").classList.remove("rf-complete");
  $("rfCounter").textContent = "GIFT " + (d.gifts.indexOf(g) + 1) + " OF " + d.gifts.length;
  $("rfGiftName").textContent = g.name;
  $("rfGiftDesc").textContent = g.description || "";
  const ph = $("rfPhoto");
  ph.innerHTML = "";
  if (g.photo) {
    const img = document.createElement("img");
    img.src = g.photo; img.alt = g.name;
    ph.appendChild(img);
  } else {
    ph.innerHTML = '<i class="fa-solid fa-gift"></i>';
  }
  rfIdleReel();
  const sub = $("rfWinnerSub");
  sub.classList.remove("show"); sub.innerHTML = "";
  rfSetSpinBtn("SPIN", true, false);
  rfRenderBoard(g.id);
}

/* ── Spin ── */
const RF_N = 50, RF_WIN = 44;

function rfAnimate(names, winnerName){
  const strip = $("rfStrip");
  const pool = names && names.length ? names : [winnerName];
  const items = [];
  for (let i = 0; i < RF_N; i++) items.push(pool[i % pool.length]);
  items[RF_WIN] = winnerName;
  strip.innerHTML = items.map(n => '<div class="rf-item"><span>' + rfEsc(n) + '</span></div>').join("");
  strip.style.transition = "none";
  strip.style.transform = "translateY(0)";
  void strip.offsetHeight;
  strip.style.transition = "transform 6s cubic-bezier(.08,.6,.12,1)";
  // percentage of the strip's own height: stays correct if the screen is resized or goes full screen
  strip.style.transform = "translateY(-" + ((RF_WIN - 1) * 100 / RF_N) + "%)";
  return new Promise(resolve => {
    let finished = false;
    const end = () => { if (finished) return; finished = true; strip.removeEventListener("transitionend", onEnd); resolve(); };
    const onEnd = e => { if (e.propertyName === "transform") end(); };
    strip.addEventListener("transitionend", onEnd);
    setTimeout(end, 6600);
  });
}

function rfFit(item){
  const span = item.querySelector("span");
  if (!span) return;
  let fs = parseFloat(getComputedStyle(span).fontSize) || 20;
  let guard = 60;
  while (span.getBoundingClientRect().width > item.clientWidth - 44 && fs > 12 && guard--) {
    fs -= 1;
    span.style.fontSize = fs + "px";
  }
}

async function rfSpin(){
  RF.busy = true;
  rfSetSpinBtn("SPINNING…", false, true);
  rfMsg("");
  let r, d;
  try {
    r = await fetch(rfApi("raffle-draw"), { method: "POST", headers: rfAuth(), body: "{}" });
    d = await r.json();
  } catch (e) {
    rfMsg("Network error. Please try again.");
    rfSetSpinBtn("SPIN", true, false);
    RF.busy = false;
    return;
  }
  if (r.status === 403) { rfBackToLogin("Session expired. Please log in again."); return; }
  if (!d.success) {
    if (d.done || /Refreshing/.test(d.message || "")) {
      try { await rfLoad(); } catch (e) {}
      rfShowCurrent();
    } else {
      rfMsg(d.message || "Could not draw.");
      rfSetSpinBtn("SPIN", true, false);
      RF.busy = false;
    }
    return;
  }
  await rfAnimate(d.reel, d.winner.name);
  rfReveal(d);
}

function rfReveal(d){
  const g = RF.data.gifts.find(x => x.id === d.giftId);
  if (g) { g.winnerId = d.winner.id; g.winnerName = d.winner.name; g.winnerSub = d.winner.sub; }
  RF.data.available = Math.max(0, RF.data.available - 1);

  const item = $("rfStrip").children[RF_WIN];
  if (item) { item.classList.add("win"); rfFit(item); }
  const sub = $("rfWinnerSub");
  sub.innerHTML = "<b>🎉 Congratulations!</b>" + rfEsc(d.winner.sub || "");
  sub.classList.add("show");

  rfPill();
  rfRenderBoard(null);
  rfConfetti();

  const more = RF.data.gifts.some(x => !x.winnerId);
  RF.state = "revealed"; RF.busy = false;
  rfSetSpinBtn(more ? "NEXT GIFT →" : "SEE ALL WINNERS", true, false);
}

function rfOnSpinBtn(){
  if (RF.busy) return;
  if (RF.state === "ready") rfSpin();
  else if (RF.state === "revealed") rfShowCurrent();
}

/* ── Confetti ── */
function rfConfetti(){
  const c = $("rfConfetti"), st = $("rfStage");
  c.width = st.clientWidth; c.height = st.clientHeight;
  const ctx = c.getContext && c.getContext("2d");
  if (!ctx) return;
  const colors = ["#ffc83d","#ffffff","#4da3ff","#ff5d73","#5be3a1"];
  const ps = [];
  for (let i = 0; i < 150; i++) {
    ps.push({ x: c.width / 2 + (Math.random() - .5) * c.width * .3, y: c.height * .45,
      vx: (Math.random() - .5) * 15, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 6,
      r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, col: colors[i % colors.length] });
  }
  let t = 0;
  (function frame(){
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => {
      p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6);
      ctx.restore();
    });
    if (++t < 160) requestAnimationFrame(frame); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}

/* ── Full screen (real fullscreen where the browser allows it, screen-filling fallback for iPhone) ── */
function rfRealFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }

async function rfToggleFs(){
  const st = $("rfStage");
  if (st.classList.contains("rf-fs")) { rfExitFs(); return; }
  st.classList.add("rf-fs");
  document.documentElement.classList.add("rf-lock");
  rfSetBars(true);
  const req = st.requestFullscreen || st.webkitRequestFullscreen;
  if (req) {
    try { await req.call(st); }
    catch (e) { st.classList.add("rf-pseudo"); }
  } else {
    st.classList.add("rf-pseudo");   // e.g. iPhone Safari: fill the whole visible screen instead
  }
}

/* Browser bars (the strip that shows the site name on phones) take the page colour instead of white */
let rfPrevViewport = null, rfThemeMeta = null;
function rfSetBars(on){
  const vp = document.querySelector('meta[name="viewport"]');
  if (on) {
    if (vp && rfPrevViewport === null) {
      rfPrevViewport = vp.getAttribute("content") || "width=device-width, initial-scale=1.0";
      vp.setAttribute("content", rfPrevViewport.replace(/,?\s*viewport-fit=\w+/, "") + ", viewport-fit=cover");
    }
    if (!rfThemeMeta) {
      rfThemeMeta = document.createElement("meta");
      rfThemeMeta.name = "theme-color";
      rfThemeMeta.content = "#0b294d";
      document.head.appendChild(rfThemeMeta);
    }
  } else {
    if (vp && rfPrevViewport !== null) { vp.setAttribute("content", rfPrevViewport); rfPrevViewport = null; }
    if (rfThemeMeta) { rfThemeMeta.remove(); rfThemeMeta = null; }
  }
}

function rfExitFs(){
  const st = $("rfStage");
  rfSetBars(false);
  st.classList.remove("rf-fs", "rf-pseudo");
  document.documentElement.classList.remove("rf-lock");
  if (rfRealFs()) {
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex) { try { ex.call(document); } catch (e) {} }
  }
}

function rfOnFsChange(){
  const st = $("rfStage");
  if (!rfRealFs() && !st.classList.contains("rf-pseudo")) {   // left via swipe / Esc
    rfSetBars(false);
    st.classList.remove("rf-fs");
    document.documentElement.classList.remove("rf-lock");
  }
}
document.addEventListener("fullscreenchange", rfOnFsChange);
document.addEventListener("webkitfullscreenchange", rfOnFsChange);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("rfStage").classList.contains("rf-pseudo")) rfExitFs();
});

/* ── Login ── */
document.getElementById("statusForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const btn  = $("viewBtn");
  const err  = $("errMsg");
  const phone= $("phone").value.trim();
  const pass = $("password").value;
  const idleText = RAFFLE_MODE ? "OPEN RAFFLE" : "VIEW STATUS";

  btn.disabled=true; btn.textContent="Checking..."; err.style.display="none";

  try{
    const r=await fetch("/api/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({phone,password:pass})
    });
    const d=await r.json();
    const isAdmin = d.success && d.user && d.user.role==="admin";

    if(isAdmin && RAFFLE_MODE){
      // Admin credentials — store JWT token and open the raffle stage on this same page
      localStorage.setItem("polycoachToken", d.token);
      localStorage.setItem("polycoachUser", JSON.stringify(d.user));
      try{
        await rfEnter();
      }catch(ex){
        err.style.display="block";
        err.textContent=ex.message||"Could not open the raffle.";
      }
      btn.disabled=false; btn.textContent=idleText;
      return;
    }

    if(isAdmin){
      // Admin credentials — store JWT token and go to dashboard
      localStorage.setItem("polycoachToken", d.token);
      localStorage.setItem("polycoachUser", JSON.stringify(d.user));
      window.location.href="Admin-Dashboard.html";
    } else if(RAFFLE_MODE){
      err.style.display="block";
      err.textContent="Only the admin can open the raffle draw.";
      btn.disabled=false; btn.textContent=idleText;
    } else {
      // Wrong credentials or not admin — go to bus status anyway
      // Show brief message then redirect
      err.style.display="block";
      err.textContent="Redirecting to bus status...";
      setTimeout(()=>window.location.href="Bust-Status-Lay.html", 1000);
    }
  }catch{
    if(RAFFLE_MODE){
      err.style.display="block";
      err.textContent="Network error. Please try again.";
      btn.disabled=false; btn.textContent=idleText;
    } else {
      // Any error — just go to bus status
      window.location.href="Bust-Status-Lay.html";
    }
  }
});

/* Admin already logged in on this device? Go straight to the stage (also after a reload or Back). */
function rfAutoEnter(){
  if (!RAFFLE_MODE || !localStorage.getItem("polycoachToken")) return;
  if ($("rfStage").classList.contains("rf-open")) return;
  const hero = document.querySelector(".Page-Body-Hero");
  hero.style.display = "none";
  $("rfLoading").classList.add("show");
  rfEnter().catch(ex => {
    hero.style.display = "";
    const err = $("errMsg");
    err.style.display = "block";
    err.textContent = (ex.status === 401 || ex.status === 403)
      ? "Session expired. Please log in again."
      : (ex.message || "Could not open the raffle.");
  }).then(() => $("rfLoading").classList.remove("show"));
}
rfAutoEnter();
window.addEventListener("pageshow", e => { if (e.persisted) rfAutoEnter(); });
</script>
