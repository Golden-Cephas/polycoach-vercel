<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Seat — PolyCoach</title>
<link rel="stylesheet" href="/css/Home-Page.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
.bus-page-body{background-image:linear-gradient(rgba(11,41,77,0.84),rgba(11,41,77,0.7)),url('/Images/Jenda.jpg');background-size:cover;background-position:center;background-attachment:fixed;min-height:90vh;padding:50px 16px;}
.bus-page-inner{max-width:600px;margin:0 auto;}
.bus-page-title{text-align:center;color:#fff;margin-bottom:24px;}
.bus-page-title h1{font-family:'Barlow Condensed',sans-serif;font-size:2.4rem;font-weight:900;text-transform:uppercase;}
.bus-page-title p{color:#ddd;margin-top:8px;font-size:0.95rem;}
.summary-card{background:rgba(255,255,255,0.97);border-radius:14px;padding:24px;margin-top:24px;box-shadow:0 12px 35px rgba(0,0,0,0.25);}
.summary-card h3{color:var(--primary);font-family:'Barlow Condensed',sans-serif;font-size:1.6rem;margin-bottom:14px;}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:0.95rem;}
.summary-row:last-child{border:none;}
.summary-label{color:#666;font-weight:700;}
.summary-val{color:var(--primary);font-weight:700;}
#confirmBtn{margin-top:16px;width:100%;}
#confirmBtn:disabled{background:#aaa;cursor:not-allowed;}
#seatTooltip{position:fixed;background:#333;color:#fff;padding:6px 12px;border-radius:5px;font-size:0.8rem;pointer-events:none;display:none;z-index:500;white-space:nowrap;}
</style>
</head>
<body>
<div class="Home-Page-Header">
  <div class="Left-Header" onclick="location.href='Home-Page.html'"><img src="/Images/Logo1.png" class="Logo1" alt="Logo"><div class="Logo-Text">PolyCoach</div></div>
  <div class="Right-Header">
    <button class="Header-Button" onclick="location.href='Home-Page.html'">Home</button>
    <button class="Header-Button" onclick="location.href='Help.html'">Help</button>
    <button class="Register-Button" onclick="logout()">Logout</button>
  </div>
</div>

<div class="bus-page-body">
  <div class="bus-page-inner">
    <div class="bus-page-title">
      <h1>Choose Your Seat</h1>
      <p>Hover over seats to see occupant info. Click an available seat to select it.</p>
    </div>

    <div class="bus-exterior">
      <div class="driver-cabin">
        <i class="fa-solid fa-dharmachakra"></i>
        <span style="font-weight:700;color:#555;">Driver</span>
      </div>
      <div id="seatMap" class="bus-grid"></div>
    </div>

    <div class="seat-legend">
      <div class="legend-item"><div class="legend-box legend-available"></div> Available</div>
      <div class="legend-item"><div class="legend-box legend-pending"></div> Pending</div>
      <div class="legend-item"><div class="legend-box legend-booked"></div> Booked</div>
      <div class="legend-item"><div class="legend-box legend-selected"></div> Selected</div>
    </div>

    <div class="summary-card">
      <h3>Booking Summary</h3>
      <div class="summary-row"><span class="summary-label">Passenger</span><span class="summary-val" id="sumName">—</span></div>
      <div class="summary-row"><span class="summary-label" id="sumDestLabel">Destination</span><span class="summary-val" id="sumDest">—</span></div>
      <div class="summary-row"><span class="summary-label">Selected Seat</span><span class="summary-val" id="sumSeat">None selected</span></div>
      <button class="submit-btn" id="confirmBtn" disabled onclick="confirmBooking()">CONFIRM BOOKING</button>
    </div>
  </div>
</div>

<div id="seatTooltip"></div>

<div class="Home-Page-Footer">
  <div class="Home-Left-Footer"><img src="/Images/Logo3.png" class="Logo1" alt="Logo"><div class="Logo-Text1">PolyCoach</div></div>
  <div class="Home-Mid-Footer">
    <button class="Footer-Button" onclick="openPopup('about')">About Us</button>
    <button class="Footer-Button" onclick="openPopup('faq')">FAQs</button>
    <button class="Footer-Button" onclick="openPopup('contact')">Contact</button>
  </div>
  <div class="Home-Right-Footer"><div class="Footer-Text">Social Media:</div><div class="Social-Container">
    <a href="https://chat.whatsapp.com/IoxQg9cuzsI1FNG7Awt8Vj" target="_blank"><div class="Footer-Icons"><img src="/Images/Facebook.png"></div></a>
    <a href="https://chat.whatsapp.com/IoxQg9cuzsI1FNG7Awt8Vj" target="_blank"><div class="Footer-Icons"><img src="/Images/Whatsapp.png"></div></a>
  </div></div>
</div>
<div id="popupOverlay" class="popup-overlay"><div class="popup-box"><div id="popupContent"></div><button class="close-btn" onclick="closePopup()">Close</button></div></div>

<script src="/js/popup.js"></script>
<script>
let selectedSeat=null;
let existingPendingSeat=null; // seat the user picked during registration
const passengerName=localStorage.getItem("passengerName");
const user=JSON.parse(localStorage.getItem("polycoachUser")||"null");
const tooltip=document.getElementById("seatTooltip");

// Guard
(function(){
  const u=JSON.parse(localStorage.getItem("polycoachUser")||"null");
  if(!u||!u.fullName){alert("Please fill in the booking form first.");window.location.href="Book-Login.html";return;}
  if(!passengerName){alert("Please go back and choose who you are booking for.");window.location.href="Book-Login.html";}
})();

document.getElementById("sumName").textContent=passengerName||"—";
if(user){
  const isOrigin=user.origin&&!user.destination;
  document.getElementById("sumDestLabel").textContent=isOrigin?"From":"Destination";
  document.getElementById("sumDest").textContent=user.destination||user.origin||"—";
}

document.addEventListener("mousemove",e=>{
  if(tooltip.style.display!=="none"){tooltip.style.left=(e.clientX+14)+"px";tooltip.style.top=(e.clientY-30)+"px";}
});

async function loadSeats(){
  const u=JSON.parse(localStorage.getItem("polycoachUser")||"{}");
  const passengerPhone=localStorage.getItem("passengerPhone")||"";
  const passengerBusId=localStorage.getItem("passengerBusId")||"";
  const isBookingForOther=!!passengerPhone&&passengerName!==(u.fullName||"");
  const busId=isBookingForOther?passengerBusId:(localStorage.getItem("polycoachBus")||"bus1");
  const seats=await(await fetch("/api/seats?busId="+busId)).json();

  // Find this passenger's existing pending seat (from registration)
  const existing=seats.find(s=>
    s.status==="pending"&&
    s.passengerName&&
    s.passengerName.trim().toLowerCase()===passengerName.trim().toLowerCase()
  );
  existingPendingSeat=existing?Number(existing.number):null;

  const map=document.getElementById("seatMap");
  map.innerHTML="";
  let counter=1;
  for(let row=0;row<13;row++){
    for(let col=1;col<=6;col++){
      if(col===3){const a=document.createElement("div");a.className="seat aisle-space";map.appendChild(a);}
      else if(counter<=65){renderSeat(seats,counter,map);counter++;}
    }
  }
  const backRow=document.createElement("div");backRow.className="back-row-container";
  for(let i=0;i<7;i++){renderSeat(seats,counter,backRow);counter++;}
  map.appendChild(backRow);

  // Pre-select their existing pending seat
  if(existingPendingSeat){
    const el=findSeatEl(existingPendingSeat);
    if(el){
      el._origStatus="pending";
      el.className="seat selected";
      selectedSeat=existingPendingSeat;
      document.getElementById("sumSeat").textContent="Seat "+existingPendingSeat;
      document.getElementById("confirmBtn").disabled=false;
    }
  }
}

function findSeatEl(num){
  return [...document.querySelectorAll(".seat")].find(el=>el.textContent==String(num)&&!el.classList.contains("aisle-space"));
}

function renderSeat(seats,num,parent){
  const data=seats.find(s=>s.number===num)||{number:num,status:"available"};
  const div=document.createElement("div");
  // If this is the passenger's own pending seat, treat as available for selection
  const isOwnSeat=existingPendingSeat===num;
  const displayStatus=isOwnSeat?"available":data.status;
  div.className="seat "+displayStatus;
  div.textContent=num;
  div.addEventListener("mouseenter",()=>{
    let tip=`Seat ${num}`;
    if(data.passengerName&&!isOwnSeat) tip+=` — ${data.passengerName}`;
    tooltip.textContent=tip;tooltip.style.display="block";
  });
  div.addEventListener("mouseleave",()=>tooltip.style.display="none");
  if(displayStatus==="available"){
    div.onclick=()=>selectSeat(num,div);
  } else {
    div.onclick=()=>showSeatMsg("Seat "+num+" is taken.");
  }
  parent.appendChild(div);
}

function selectSeat(num,el){
  document.querySelectorAll(".seat.selected").forEach(s=>{
    s.className="seat "+(s._origStatus||"available");
  });
  el._origStatus=el._origStatus||"available";
  el.className="seat selected";
  selectedSeat=num;
  document.getElementById("sumSeat").textContent="Seat "+num;
  document.getElementById("confirmBtn").disabled=false;
}

function showSeatMsg(text){
  let el=document.getElementById("seatMsg");
  if(!el){el=document.createElement("div");el.id="seatMsg";el.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 22px;border-radius:8px;font-weight:700;font-size:0.9rem;z-index:999;";document.body.appendChild(el);}
  el.textContent=text;el.style.display="block";
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.display="none",2200);
}

async function confirmBooking(){
  if(!selectedSeat) return;
  const btn=document.getElementById("confirmBtn");
  btn.disabled=true;btn.textContent="Booking...";
  try{
    const u=JSON.parse(localStorage.getItem("polycoachUser")||"{}");
    const passengerPhone=localStorage.getItem("passengerPhone")||"";
    const passengerBusId=localStorage.getItem("passengerBusId")||"";
    const isBookingForOther=!!passengerPhone&&passengerName!==(u.fullName||"");
    const busId=isBookingForOther?passengerBusId:(localStorage.getItem("polycoachBus")||"bus1");
    const phone=isBookingForOther?passengerPhone:(u.phone||"");
    // If they chose a different seat, release the old one silently
    const releasing=existingPendingSeat&&existingPendingSeat!==selectedSeat;
    const payload={
      seatNumber:Number(selectedSeat),busId,
      passengerName,
      destination:u.destination||"",
      origin:u.origin||"",
      phone,
      program:u.program||"",
      paymentProof:localStorage.getItem("paymentProofUrl")||null,
      releaseOldSeat:releasing?existingPendingSeat:null
    };
    const r=await fetch("/api/book-seat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const d=await r.json();
    if(d.success){
      localStorage.removeItem("passengerName");
      localStorage.removeItem("passengerPhone");
      localStorage.removeItem("passengerBusId");
      localStorage.setItem("lastBookedSeat",String(selectedSeat));
      fetch("/api/settings").then(r=>r.json()).then(s=>{
        localStorage.setItem("departureVenue",s.departureVenue||"MUBAS");
        localStorage.setItem("departureDate",s.departureDate||"");
      }).catch(()=>{}).finally(()=>window.location.href="Final-Thanks.html");
    } else {
      showSeatMsg(d.message||"Booking failed. Try another seat.");
      btn.disabled=false;btn.textContent="CONFIRM BOOKING";
      selectedSeat=null;
      document.getElementById("sumSeat").textContent="None selected";
      loadSeats();
    }
  }catch{
    showSeatMsg("Server error. Please try again.");
    btn.disabled=false;btn.textContent="CONFIRM BOOKING";
  }
}

async function logout(){await fetch("/api/logout");localStorage.clear();window.location.href="Home-Page.html";}
loadSeats();
</script>
</body>
</html>
